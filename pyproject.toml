[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "gnbsim"
version = "0.1.0"
description = "Single-cell gNB scheduler simulator with a kb-rag explaining agent"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = ["numpy", "PyYAML", "matplotlib"]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
gnbsim = "gnbsim.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
